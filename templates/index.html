<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Car Events Tracker</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" rel="stylesheet">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
    </head>
<body>
<h2>🚗 Car Events Tracker</h2>

<form action="/add" method="post" enctype="multipart/form-data">
    <input type="text" id="datePicker" name="date" placeholder="Select Date" required>
    <input type="text" name="mileage" placeholder="Mileage (e.g., 127.900)" required>

    <div class="checkboxes">
        <label><input type="checkbox" name="tasks" value="Oil service"> Oil service</label>
        <label><input type="checkbox" name="tasks" value="Diesel filter"> Diesel filter</label>
        <label><input type="checkbox" name="tasks" value="Brake pads front"> Brake pads front</label>
        <label><input type="checkbox" name="tasks" value="Brake pads rear"> Brake pads rear</label>
        <label><input type="checkbox" name="tasks" value="Brake disc front"> Brake disc front</label>
        <label><input type="checkbox" name="tasks" value="Brake disc rear"> Brake disc rear</label>
        <label><input type="checkbox" name="tasks" value="Brake fluid"> Brake fluid</label>
        <label><input type="checkbox" name="tasks" value="Micro filter"> Micro filter</label>
        <label><input type="checkbox" name="tasks" value="Coupe filter"> Coupe filter</label>
        <label><input type="checkbox" name="tasks" value="Air filter"> Air filter</label>
        <label><input type="checkbox" name="tasks" value="Glow plugs"> Glow plugs</label>
        <label><input type="checkbox" name="tasks" value="Vehicle inspection"> Vehicle inspection</label>
        <label><input type="checkbox" name="tasks" value="EU control"> EU control</label>
    </div>

    <textarea name="description" placeholder="Extra details..."></textarea>
    <input type="file" name="photo">
    <button>Add Event</button>
</form>
<a href="{{ url_for('events.upcoming') }}">📅 See Upcoming Maintenance</a>

<table>
    <tr>
        <th>Date</th>
        <th>Mileage (km)</th>
        <th>Description</th>
        <th>Photo</th>
        <th>Edit</th>
        <th>Delete</th>
    </tr>
    {% for event in events %}
    <tr>
        <td>{{ event['date'] }}</td>
        <td>{{ event['mileage'] }}</td>
        <td>{{ event['description'] }}</td>
        <td>
        {% if event['photo'] %}
            <img src="{{ url_for('static', filename='uploads/' + event['photo']) }}" onclick="showOverlay(this.src)">
        {% else %}No photo{% endif %}
        </td>
        <td><a href="{{ url_for('events.edit', id=event['id']) }}">✏️</a></td>
        <td><a href="{{ url_for('events.delete', id=event['id']) }}">🗑️</a></td>
    </tr>
    {% endfor %}
</table>

<div id="overlay" onclick="hideOverlay()">
    <span>&times;</span>
    <img id="overlay-img">
</div>

<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script>
function showOverlay(src) {
    document.getElementById('overlay-img').src = src;
    document.getElementById('overlay').style.display = 'flex';
}
function hideOverlay() {
    document.getElementById('overlay').style.display = 'none';
}

flatpickr("#datePicker", { dateFormat: "Y-m-d" });
</script>
</body>
</html>
